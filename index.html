<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda Amiga</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        header { text-align: center; color: white; margin-bottom: 30px; }
        header h1 { font-size: 2.5em; margin-bottom: 10px; }
        .card { background: white; border-radius: 10px; padding: 20px; margin-bottom: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        .card h2 { color: #764ba2; margin-bottom: 15px; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 15px; }
        .form-group { display: flex; flex-direction: column; }
        label { font-weight: bold; margin-bottom: 5px; color: #555; }
        input, select, textarea { padding: 10px; border: 2px solid #e0e0e0; border-radius: 5px; font-size: 1em; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: #764ba2; }
        textarea { grid-column: 1 / -1; resize: vertical; }
        .btn { background: linear-gradient(135deg, #667eea, #764ba2); color: white; border: none; padding: 12px 25px; border-radius: 5px; font-size: 1em; font-weight: bold; cursor: pointer; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(118,75,162,0.4); }
        .btn-danger { background: #ff6b6b; }
        .btn-small { padding: 5px 10px; font-size: 0.9em; }
        .btn-secondary { background: #6c757d; }
        .filters { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 15px; }
        .filter-btn { padding: 6px 14px; border: 2px solid #764ba2; background: white; color: #764ba2; border-radius: 20px; cursor: pointer; font-weight: bold; }
        .filter-btn.active { background: #764ba2; color: white; }
        .event-item { display: flex; align-items: center; padding: 15px; border-radius: 8px; background: #f8f9ff; border-left: 5px solid #764ba2; margin-bottom: 10px; }
        .event-item.today { background: #fff4e6; border-left-color: #ff9800; }
        .event-icon { font-size: 2em; margin-right: 15px; }
        .event-info { flex: 1; }
        .event-title { font-weight: bold; font-size: 1.1em; }
        .event-meta { color: #666; font-size: 0.9em; margin-top: 3px; }
        .badge { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 0.75em; font-weight: bold; color: white; margin-left: 5px; }
        .badge-medico { background: #e74c3c; }
        .badge-escola { background: #3498db; }
        .badge-reuniao { background: #27ae60; }
        .badge-evento { background: #f39c12; }
        .status-bar { background: rgba(255,255,255,0.2); color: white; padding: 10px; border-radius: 5px; text-align: center; margin-bottom: 20px; }
        .alert-balloon { position: fixed; top: 20px; right: 20px; background: white; border-radius: 10px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); max-width: 350px; z-index: 1000; border-left: 6px solid #ff9800; display: none; }
        .alert-balloon.show { display: block; }
        .alert-close { position: absolute; top: 10px; right: 15px; background: none; border: none; font-size: 1.5em; cursor: pointer; }
        .empty { text-align: center; padding: 40px; color: #888; }
        footer { text-align: center; color: white; margin-top: 20px; }
        footer a { color: white; }
        @media (max-width: 600px) { .event-item { flex-direction: column; align-items: flex-start; } }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Agenda Amiga</h1>
            <p>Sua companheira para nao esquecer nenhum compromisso!</p>
        </header>

        <div class="status-bar" id="statusBar">Carregando...</div>

        <div class="card">
            <h2>Novo Compromisso</h2>
            <form id="eventForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Titulo *</label>
                        <input type="text" id="title" required placeholder="Ex: Consulta Dr. Silva">
                    </div>
                    <div class="form-group">
                        <label>Categoria *</label>
                        <select id="category" required>
                            <option value="medico">Medico</option>
                            <option value="escola">Escola</option>
                            <option value="reuniao">Reuniao</option>
                            <option value="evento">Evento</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Data *</label>
                        <input type="date" id="date" required>
                    </div>
                    <div class="form-group">
                        <label>Hora *</label>
                        <input type="time" id="time" required>
                    </div>
                    <div class="form-group" style="grid-column: 1 / -1;">
                        <label>Descricao (opcional)</label>
                        <textarea id="description" placeholder="Detalhes do compromisso..."></textarea>
                    </div>
                </div>
                <button type="submit" class="btn">Salvar Compromisso</button>
            </form>
        </div>

        <div class="card">
            <h2>Meus Compromissos</h2>
            <div class="filters">
                <button class="filter-btn active" data-filter="all">Todos</button>
                <button class="filter-btn" data-filter="today">Hoje</button>
                <button class="filter-btn" data-filter="medico">Medico</button>
                <button class="filter-btn" data-filter="escola">Escola</button>
                <button class="filter-btn" data-filter="reuniao">Reuniao</button>
                <button class="filter-btn" data-filter="evento">Evento</button>
            </div>
            <div id="eventsList"></div>
            <div style="margin-top: 15px; display: flex; gap: 10px;">
                <button class="btn btn-secondary btn-small" onclick="syncFromCloud()">Sincronizar da Nuvem</button>
                <button class="btn btn-secondary btn-small" onclick="forceSyncToCloud()">Enviar para Nuvem</button>
            </div>
        </div>

        <footer>
            <p>Feito com amor | <a href="https://github.com/evicom/agenda_amiga">Codigo no GitHub</a></p>
        </footer>
    </div>

    <div class="alert-balloon" id="alertBalloon">
        <button class="alert-close" onclick="closeAlert()">x</button>
        <h3 id="alertTitle">Lembrete!</h3>
        <p id="alertContent"></p>
    </div>

    <script>
        // CONFIGURACAO DA NUVEM
        const CLOUD_CONFIG = {
            binId: '6a8f816cda38895dfe15b0d6',
            masterKey: '$2a$10$8Wm2Ixc0mRA38i0rNyecw.HFCnENmYPaEOnz6iIeon0uyxDxgzHAS',
            baseUrl: 'https://api.jsonbin.io/v3/b'
        };

        let events = [];
        let currentFilter = 'all';
        let alertedToday = JSON.parse(localStorage.getItem('agendaAmiga_alerted') || '{}');
        let saveTimeout = null;

        const categoryIcons = { medico: '🏥', escola: '', reuniao: '💼', evento: '🎉' };
        const categoryNames = { medico: 'Medico', escola: 'Escola', reuniao: 'Reuniao', evento: 'Evento' };
        const categoryColors = { medico: 'badge-medico', escola: 'badge-escola', reuniao: 'badge-reuniao', evento: 'badge-evento' };

        function setSyncStatus(state, text) {
            const statusBar = document.getElementById('statusBar');
            if (statusBar) statusBar.textContent = text;
        }

        async function loadFromCloud() {
            try {
                const response = await fetch(CLOUD_CONFIG.baseUrl + '/' + CLOUD_CONFIG.binId + '/latest', {
                    method: 'GET',
                    headers: { 'X-Master-Key': CLOUD_CONFIG.masterKey }
                });
                if (response.ok) {
                    const data = await response.json();
                    events = data.record?.events || [];
                    localStorage.setItem('agendaAmiga_events', JSON.stringify(events));
                    setSyncStatus('Sincronizado (' + events.length + ' compromissos)');
                } else {
                    events = JSON.parse(localStorage.getItem('agendaAmiga_events') || '[]');
                    setSyncStatus('Modo offline - ' + events.length + ' compromissos');
                }
            } catch (err) {
                events = JSON.parse(localStorage.getItem('agendaAmiga_events') || '[]');
                setSyncStatus('Modo offline - ' + events.length + ' compromissos');
            }
        }

        async function saveToCloud() {
            try {
                await fetch(CLOUD_CONFIG.baseUrl + '/' + CLOUD_CONFIG.binId, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'X-Master-Key': CLOUD_CONFIG.masterKey },
                    body: JSON.stringify({ events: events })
                });
                setSyncStatus('Salvo na nuvem!');
            } catch (err) {
                setSyncStatus('Erro ao salvar na nuvem');
            }
        }

        function scheduleSaveToCloud() {
            if (saveTimeout) clearTimeout(saveTimeout);
            saveTimeout = setTimeout(saveToCloud, 1000);
        }

        function formatDate(dateStr) {
            var parts = dateStr.split('-');
            return parts[2] + '/' + parts[1] + '/' + parts[0];
        }

        function getTodayStr() {
            var d = new Date();
            var year = d.getFullYear();
            var month = String(d.getMonth() + 1).padStart(2, '0');
            var day = String(d.getDate()).padStart(2, '0');
            return year + '-' + month + '-' + day;
        }

        function isToday(dateStr) { return dateStr === getTodayStr(); }
        function isPast(dateStr) { return dateStr < getTodayStr(); }

        function renderEvents() {
            var list = document.getElementById('eventsList');
            var filtered = events.slice();

            if (currentFilter === 'today') {
                filtered = filtered.filter(function(e) { return isToday(e.date); });
            } else if (currentFilter !== 'all') {
                filtered = filtered.filter(function(e) { return e.category === currentFilter; });
            }

            filtered.sort(function(a, b) {
                if (isToday(a.date) && !isToday(b.date)) return -1;
                if (!isToday(a.date) && isToday(b.date)) return 1;
                if (a.date !== b.date) return a.date.localeCompare(b.date);
                return a.time.localeCompare(b.time);
            });

            if (filtered.length === 0) {
                list.innerHTML = '<div class="empty"><p>Nenhum compromisso encontrado.</p><p>Adicione um novo acima!</p></div>';
                return;
            }

            var html = '';
            for (var i = 0; i < filtered.length; i++) {
                var ev = filtered[i];
                var todayClass = isToday(ev.date) ? 'today' : '';
                var pastClass = isPast(ev.date) && !isToday(ev.date) ? 'style="opacity: 0.6;"' : '';
                var icon = categoryIcons[ev.category] || '📅';
                var badgeClass = categoryColors[ev.category] || '';
                var badgeText = categoryNames[ev.category] || '';
                var todayBadge = isToday(ev.date) ? ' <strong style="color:#ff9800;">HOJE</strong>' : '';
                
                html += '<div class="event-item ' + todayClass + '" ' + pastClass + '>';
                html += '<div class="event-icon">' + icon + '</div>';
                html += '<div class="event-info">';
                html += '<div class="event-title">' + ev.title + ' <span class="badge ' + badgeClass + '">' + badgeText + '</span>' + todayBadge + '</div>';
                html += '<div class="event-meta">' + formatDate(ev.date) + ' as ' + ev.time + '</div>';
                if (ev.description) {
                    html += '<div style="color:#777;font-size:0.85em;margin-top:5px;">' + ev.description + '</div>';
                }
                html += '</div>';
                html += '<button class="btn btn-danger btn-small" onclick="deleteEvent(\'' + ev.id + '\')">Excluir</button>';
                html += '</div>';
            }
            list.innerHTML = html;
        }

        function updateStatusBar() {
            var now = new Date();
            var todayEvents = events.filter(function(e) { return isToday(e.date); });
            var hour = now.getHours();
            var min = String(now.getMinutes()).padStart(2, '0');
            var timeStr = String(hour).padStart(2, '0') + ':' + min;
            var dateStr = formatDate(getTodayStr());

            var status = dateStr + ' - ' + timeStr;
            if (todayEvents.length > 0) {
                status += ' - ' + todayEvents.length + ' compromisso(s) hoje';
            } else {
                status += ' - Dia livre!';
            }

            if (hour >= 1 && hour < 12) status += ' - Bom dia!';
            else if (hour >= 12 && hour < 18) status += ' - Boa tarde!';
            else status += ' - Boa noite!';

            document.getElementById('statusBar').textContent = status;
        }

        document.getElementById('eventForm').addEventListener('submit', function(e) {
            e.preventDefault();
            var newEvent = {
                id: Date.now().toString(),
                title: document.getElementById('title').value.trim(),
                category: document.getElementById('category').value,
                date: document.getElementById('date').value,
                time: document.getElementById('time').value,
                description: document.getElementById('description').value.trim()
            };
            events.push(newEvent);
            localStorage.setItem('agendaAmiga_events', JSON.stringify(events));
            scheduleSaveToCloud();
            renderEvents();
            updateStatusBar();
            this.reset();
            document.getElementById('date').value = getTodayStr();
            showBalloon('Compromisso salvo!', newEvent.title + ' em ' + formatDate(newEvent.date) + ' as ' + newEvent.time);
        });

        function deleteEvent(id) {
            if (confirm('Deseja realmente excluir este compromisso?')) {
                events = events.filter(function(e) { return e.id !== id; });
                localStorage.setItem('agendaAmiga_events', JSON.stringify(events));
                scheduleSaveToCloud();
                renderEvents();
                updateStatusBar();
            }
        }

        var filterBtns = document.querySelectorAll('.filter-btn');
        for (var i = 0; i < filterBtns.length; i++) {
            filterBtns[i].addEventListener('click', function() {
                for (var j = 0; j < filterBtns.length; j++) {
                    filterBtns[j].classList.remove('active');
                }
                this.classList.add('active');
                currentFilter = this.getAttribute('data-filter');
                renderEvents();
            });
        }

        function showBalloon(title, content) {
            document.getElementById('alertTitle').textContent = title;
            document.getElementById('alertContent').textContent = content;
            var balloon = document.getElementById('alertBalloon');
            balloon.classList.add('show');
            setTimeout(function() { balloon.classList.remove('show'); }, 5000);
        }

        function closeAlert() {
            document.getElementById('alertBalloon').classList.remove('show');
        }

        function syncFromCloud() {
            loadFromCloud().then(function() {
                renderEvents();
                updateStatusBar();
            });
        }

        function forceSyncToCloud() {
            saveToCloud();
        }

        function checkDailyAlerts() {
            var now = new Date();
            var hour = now.getHours();
            var todayStr = getTodayStr();

            if (hour < 1) return;
            if (alertedToday[todayStr]) return;

            var todayEvents = events.filter(function(e) { return e.date === todayStr; });
            if (todayEvents.length === 0) return;

            var msg = 'Voce tem ' + todayEvents.length + ' compromisso(s) hoje!\n\n';
            for (var i = 0; i < todayEvents.length; i++) {
                var e = todayEvents[i];
                msg += e.time + ' - ' + e.title + '\n';
            }

            showBalloon('Lembrete!', msg);
            alertedToday[todayStr] = true;
            localStorage.setItem('agendaAmiga_alerted', JSON.stringify(alertedToday));
        }

        function init() {
            document.getElementById('date').value = getTodayStr();
            document.getElementById('time').value = '09:00';
            
            loadFromCloud().then(function() {
                renderEvents();
                updateStatusBar();
                
                setInterval(function() {
                    checkDailyAlerts();
                    updateStatusBar();
                }, 30000);
            });
        }

        init();
    </script>
</body>
</html>
