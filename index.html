<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda Amiga</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
        
        body { 
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 50%, #0d1117 100%);
            min-height: 100vh; 
            padding: 20px; 
            color: #e6edf3;
        }
        
        .container { max-width: 1100px; margin: 0 auto; }
        
        header { 
            text-align: center; 
            margin-bottom: 30px;
            padding: 20px;
        }
        
        header h1 { 
            font-size: 2.8em; 
            margin-bottom: 10px;
            background: linear-gradient(135deg, #00d4ff, #58a6ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(0, 212, 255, 0.3);
        }
        
        header p { 
            color: #8b949e;
            font-size: 1.1em;
        }

        .sync-status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(30, 36, 68, 0.6);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85em;
            margin-top: 10px;
            border: 1px solid #30363d;
            color: #8b949e;
        }
        
        .sync-dot {
            width: 10px; height: 10px; border-radius: 50%;
            background: #f0883e;
        }
        .sync-dot.ok { background: #3fb950; box-shadow: 0 0 10px #3fb950; }
        .sync-dot.error { background: #f85149; }
        .sync-dot.saving { background: #f0883e; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0.3; } }

        .card { 
            background: linear-gradient(135deg, #161b33, #1e2444);
            border-radius: 15px; 
            padding: 25px; 
            margin-bottom: 25px; 
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            border: 1px solid #30363d;
        }
        
        .card h2 { 
            color: #58a6ff; 
            margin-bottom: 20px; 
            font-size: 1.5em;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); 
            gap: 15px; 
            margin-bottom: 15px; 
        }
        
        .form-group { display: flex; flex-direction: column; }
        
        label { 
            font-weight: 600; 
            margin-bottom: 6px; 
            color: #c9d1d9;
            font-size: 0.9em;
        }
        
        input, select, textarea { 
            padding: 12px; 
            background: #0d1117;
            border: 2px solid #30363d; 
            border-radius: 8px; 
            font-size: 1em;
            color: #e6edf3;
            transition: all 0.3s;
        }
        
        input:focus, select:focus, textarea:focus { 
            outline: none; 
            border-color: #00d4ff;
            box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.1);
        }
        
        textarea { grid-column: 1 / -1; resize: vertical; min-height: 70px; }
        
        select option { background: #0d1117; color: #e6edf3; }

        .btn { 
            background: linear-gradient(135deg, #1f6feb, #0099ff); 
            color: white; 
            border: none; 
            padding: 12px 25px; 
            border-radius: 8px; 
            font-size: 1em; 
            font-weight: 600; 
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(31, 111, 235, 0.3);
        }
        
        .btn:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 6px 20px rgba(31, 111, 235, 0.5);
            background: linear-gradient(135deg, #0099ff, #00d4ff);
        }
        
        .btn-danger { 
            background: linear-gradient(135deg, #da3633, #f85149); 
            box-shadow: 0 4px 15px rgba(248, 81, 73, 0.3);
        }
        
        .btn-danger:hover {
            box-shadow: 0 6px 20px rgba(248, 81, 73, 0.5);
        }
        
        .btn-small { padding: 6px 12px; font-size: 0.85em; }
        
        .btn-secondary { 
            background: linear-gradient(135deg, #30363d, #484f58);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .medication-fields {
            display: none;
            grid-column: 1 / -1;
            background: rgba(0, 212, 255, 0.05);
            border: 1px solid rgba(0, 212, 255, 0.2);
            border-radius: 10px;
            padding: 15px;
            margin-top: 10px;
        }
        
        .medication-fields.show { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }

        .filters { 
            display: flex; 
            gap: 10px; 
            flex-wrap: wrap; 
            margin-bottom: 20px; 
        }
        
        .filter-btn { 
            padding: 8px 16px; 
            border: 2px solid #30363d; 
            background: #0d1117; 
            color: #c9d1d9; 
            border-radius: 20px; 
            cursor: pointer; 
            font-weight: 600;
            transition: all 0.3s;
            font-size: 0.9em;
        }
        
        .filter-btn:hover {
            border-color: #58a6ff;
            color: #58a6ff;
        }
        
        .filter-btn.active { 
            background: linear-gradient(135deg, #1f6feb, #0099ff); 
            color: white; 
            border-color: #0099ff;
            box-shadow: 0 4px 15px rgba(31, 111, 235, 0.4);
        }

        .events-list { display: flex; flex-direction: column; gap: 12px; }
        
        .event-item { 
            display: flex; 
            align-items: center; 
            padding: 18px; 
            border-radius: 12px; 
            background: linear-gradient(135deg, #1e2444, #161b33);
            border-left: 5px solid #58a6ff; 
            transition: all 0.3s;
            border: 1px solid #30363d;
            border-left-width: 5px;
        }
        
        .event-item:hover { 
            transform: translateX(5px);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.4);
        }
        
        .event-item.today { 
            background: linear-gradient(135deg, #2d1f0a, #3d2810);
            border-left-color: #f0883e; 
            animation: pulse 2s infinite; 
        }
        
        .event-item.medication-due {
            background: linear-gradient(135deg, #1a2f1a, #0d1f0d);
            border-left-color: #3fb950;
            animation: medicationPulse 1.5s infinite;
        }
        
        .event-item.past { opacity: 0.5; }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(240, 136, 62, 0.4); }
            50% { box-shadow: 0 0 0 10px rgba(240, 136, 62, 0); }
        }
        
        @keyframes medicationPulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(63, 185, 80, 0.5); }
            50% { box-shadow: 0 0 0 12px rgba(63, 185, 80, 0); }
        }

        .event-icon { font-size: 2.2em; margin-right: 15px; min-width: 50px; text-align: center; }
        .event-info { flex: 1; }
        .event-title { font-weight: 700; font-size: 1.15em; color: #e6edf3; margin-bottom: 4px; }
        .event-meta { color: #8b949e; font-size: 0.9em; margin-top: 3px; }
        .event-desc { color: #8b949e; font-size: 0.85em; margin-top: 6px; font-style: italic; }
        .event-actions { display: flex; gap: 8px; margin-left: 10px; }

        .category-medico { border-left-color: #f85149; }
        .category-escola { border-left-color: #58a6ff; }
        .category-reuniao { border-left-color: #3fb950; }
        .category-evento { border-left-color: #f0883e; }
        .category-aniversario { border-left-color: #d2a8ff; }
        .category-medicamento { border-left-color: #3fb950; }

        .badge { 
            display: inline-block; 
            padding: 3px 10px; 
            border-radius: 12px; 
            font-size: 0.75em; 
            font-weight: 700; 
            color: white; 
            margin-left: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .badge-medico { background: #f85149; }
        .badge-escola { background: #58a6ff; }
        .badge-reuniao { background: #3fb950; }
        .badge-evento { background: #f0883e; }
        .badge-aniversario { background: #d2a8ff; color: #0d1117; }
        .badge-medicamento { background: #3fb950; }

        .status-bar { 
            background: linear-gradient(135deg, #1e2444, #161b33);
            color: #58a6ff; 
            padding: 12px; 
            border-radius: 10px; 
            text-align: center; 
            margin-bottom: 20px; 
            font-size: 0.95em;
            border: 1px solid #30363d;
            font-weight: 500;
        }

        .alert-balloon { 
            position: fixed; 
            top: 20px; 
            right: 20px; 
            background: linear-gradient(135deg, #1e2444, #161b33);
            border-radius: 12px; 
            padding: 20px 25px; 
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6); 
            max-width: 380px; 
            z-index: 1000; 
            border: 2px solid #00d4ff;
            border-left: 6px solid #00d4ff;
            display: none;
            animation: slideIn 0.5s ease-out;
        }
        
        .alert-balloon.show { display: block; }
        .alert-balloon.medication {
            border-color: #3fb950;
            border-left-color: #3fb950;
        }
        
        @keyframes slideIn {
            from { transform: translateX(400px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        .alert-title { 
            color: #00d4ff; 
            font-weight: 700; 
            font-size: 1.3em; 
            margin-bottom: 10px;
        }
        
        .alert-balloon.medication .alert-title {
            color: #3fb950;
        }
        
        .alert-content { color: #c9d1d9; line-height: 1.6; font-size: 0.95em; }
        
        .alert-close { 
            position: absolute; 
            top: 10px; 
            right: 15px; 
            background: none; 
            border: none; 
            font-size: 1.5em; 
            cursor: pointer; 
            color: #8b949e;
        }
        
        .alert-close:hover { color: #e6edf3; }

        .empty { text-align: center; padding: 40px; color: #8b949e; }
        .empty-icon { font-size: 3em; margin-bottom: 10px; }

        .cloud-actions { 
            display: flex; 
            gap: 10px; 
            margin-top: 20px; 
            flex-wrap: wrap; 
        }

        .medication-reminder {
            display: inline-block;
            background: rgba(63, 185, 80, 0.15);
            color: #3fb950;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 0.8em;
            font-weight: 600;
            margin-top: 5px;
            border: 1px solid rgba(63, 185, 80, 0.3);
        }

        footer { 
            text-align: center; 
            color: #8b949e; 
            padding: 20px; 
            font-size: 0.9em; 
        }
        
        footer a { color: #58a6ff; text-decoration: none; }
        footer a:hover { text-decoration: underline; }

        @media (max-width: 600px) { 
            header h1 { font-size: 2em; } 
            .event-item { flex-direction: column; align-items: flex-start; } 
            .event-actions { margin-top: 10px; width: 100%; justify-content: flex-end; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Agenda Amiga</h1>
            <p>Sua companheira para nao esquecer nenhum compromisso!</p>
            <div class="sync-status" id="syncStatus">
                <span class="sync-dot" id="syncDot"></span>
                <span id="syncText">Conectando...</span>
            </div>
        </header>

        <div class="status-bar" id="statusBar">Carregando...</div>

        <div class="card">
            <h2>Novo Compromisso</h2>
            <form id="eventForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Titulo *</label>
                        <input type="text" id="title" required placeholder="Ex: Consulta Dr. Silva">
                    </div>
                    <div class="form-group">
                        <label>Categoria *</label>
                        <select id="category" required>
                            <option value="medico">Medico</option>
                            <option value="escola">Escola</option>
                            <option value="reuniao">Reuniao</option>
                            <option value="evento">Evento</option>
                            <option value="aniversario">Aniversario</option>
                            <option value="medicamento">Medicamento</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Data *</label>
                        <input type="date" id="date" required>
                    </div>
                    <div class="form-group">
                        <label>Hora *</label>
                        <input type="time" id="time" required>
                    </div>
                    <div class="form-group" style="grid-column: 1 / -1;">
                        <label>Descricao (opcional)</label>
                        <textarea id="description" placeholder="Detalhes do compromisso..."></textarea>
                    </div>
                </div>
                
                <div class="medication-fields" id="medicationFields">
                    <div class="form-group">
                        <label>Dosagem</label>
                        <input type="text" id="dosage" placeholder="Ex: 500mg, 1 comprimido">
                    </div>
                    <div class="form-group">
                        <label>Frequencia</label>
                        <select id="frequency">
                            <option value="unica">Dose unica</option>
                            <option value="diaria">Diaria</option>
                            <option value="12h">De 12 em 12 horas</option>
                            <option value="8h">De 8 em 8 horas</option>
                            <option value="6h">De 6 em 6 horas</option>
                            <option value="semanal">Semanal</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Duracao (dias)</label>
                        <input type="number" id="duration" placeholder="Ex: 7" min="1">
                    </div>
                </div>
                
                <button type="submit" class="btn">Salvar Compromisso</button>
            </form>
        </div>

        <div class="card">
            <h2>Meus Compromissos</h2>
            <div class="filters">
                <button class="filter-btn active" data-filter="all">Todos</button>
                <button class="filter-btn" data-filter="today">Hoje</button>
                <button class="filter-btn" data-filter="medico">Medico</button>
                <button class="filter-btn" data-filter="escola">Escola</button>
                <button class="filter-btn" data-filter="reuniao">Reuniao</button>
                <button class="filter-btn" data-filter="evento">Evento</button>
                <button class="filter-btn" data-filter="aniversario">Aniversario</button>
                <button class="filter-btn" data-filter="medicamento">Medicamento</button>
            </div>
            <div class="events-list" id="eventsList"></div>
            <div class="cloud-actions">
                <button class="btn btn-secondary btn-small" onclick="syncFromCloud()">Sincronizar da Nuvem</button>
                <button class="btn btn-secondary btn-small" onclick="forceSyncToCloud()">Enviar para Nuvem</button>
            </div>
        </div>

        <footer>
            <p>Feito com amor | <a href="https://github.com/evicom/agenda_amiga">Codigo no GitHub</a></p>
        </footer>
    </div>

    <div class="alert-balloon" id="alertBalloon">
        <button class="alert-close" onclick="closeAlert()">x</button>
        <h3 class="alert-title" id="alertTitle">Lembrete!</h3>
        <p class="alert-content" id="alertContent"></p>
    </div>

    <script>
        const CLOUD_CONFIG = {
            binId: '6a8f816cda38895dfe15b0d6',
            masterKey: '$2a$10$8Wm2Ixc0mRA38i0rNyecw.HFCnENmYPaEOnz6iIeon0uyxDxgzHAS',
            baseUrl: 'https://api.jsonbin.io/v3/b'
        };

        let events = [];
        let currentFilter = 'all';
        let alertedToday = JSON.parse(localStorage.getItem('agendaAmiga_alerted') || '{}');
        let medicationAlerts = JSON.parse(localStorage.getItem('agendaAmiga_medAlerts') || '{}');
        let saveTimeout = null;

        const categoryIcons = { 
            medico: '🏥', 
            escola: '🎓', 
            reuniao: '💼', 
            evento: '',
            aniversario: '',
            medicamento: '💊'
        };
        
        const categoryNames = { 
            medico: 'Medico', 
            escola: 'Escola', 
            reuniao: 'Reuniao', 
            evento: 'Evento',
            aniversario: 'Aniversario',
            medicamento: 'Medicamento'
        };
        
        const categoryColors = { 
            medico: 'badge-medico', 
            escola: 'badge-escola', 
            reuniao: 'badge-reuniao', 
            evento: 'badge-evento',
            aniversario: 'badge-aniversario',
            medicamento: 'badge-medicamento'
        };

        // Mostrar campos de medicamento quando selecionado
        document.getElementById('category').addEventListener('change', function() {
            const medFields = document.getElementById('medicationFields');
            if (this.value === 'medicamento') {
                medFields.classList.add('show');
            } else {
                medFields.classList.remove('show');
            }
        });

        function setSyncStatus(state, text) {
            const dot = document.getElementById('syncDot');
            const txt = document.getElementById('syncText');
            if (dot) dot.className = 'sync-dot ' + state;
            if (txt) txt.textContent = text;
        }

        async function loadFromCloud() {
            try {
                const response = await fetch(CLOUD_CONFIG.baseUrl + '/' + CLOUD_CONFIG.binId + '/latest', {
                    method: 'GET',
                    headers: { 'X-Master-Key': CLOUD_CONFIG.masterKey }
                });
                if (response.ok) {
                    const data = await response.json();
                    events = data.record?.events || [];
                    localStorage.setItem('agendaAmiga_events', JSON.stringify(events));
                    setSyncStatus('ok', 'Sincronizado (' + events.length + ')');
                } else {
                    events = JSON.parse(localStorage.getItem('agendaAmiga_events') || '[]');
                    setSyncStatus('error', 'Offline - ' + events.length + ' itens');
                }
            } catch (err) {
                events = JSON.parse(localStorage.getItem('agendaAmiga_events') || '[]');
                setSyncStatus('error', 'Offline - ' + events.length + ' itens');
            }
        }

        async function saveToCloud() {
            try {
                await fetch(CLOUD_CONFIG.baseUrl + '/' + CLOUD_CONFIG.binId, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'X-Master-Key': CLOUD_CONFIG.masterKey },
                    body: JSON.stringify({ events: events })
                });
                setSyncStatus('ok', 'Salvo na nuvem!');
            } catch (err) {
                setSyncStatus('error', 'Erro ao salvar');
            }
        }

        function scheduleSaveToCloud() {
            if (saveTimeout) clearTimeout(saveTimeout);
            setSyncStatus('saving', 'Salvando...');
            saveTimeout = setTimeout(saveToCloud, 1000);
        }

        function formatDate(dateStr) {
            var parts = dateStr.split('-');
            return parts[2] + '/' + parts[1] + '/' + parts[0];
        }

        function getTodayStr() {
            var d = new Date();
            var year = d.getFullYear();
            var month = String(d.getMonth() + 1).padStart(2, '0');
            var day = String(d.getDate()).padStart(2, '0');
            return year + '-' + month + '-' + day;
        }

        function getCurrentTimeStr() {
            var d = new Date();
            return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
        }

        function isToday(dateStr) { return dateStr === getTodayStr(); }
        function isPast(dateStr) { return dateStr < getTodayStr(); }

        function renderEvents() {
            var list = document.getElementById('eventsList');
            var filtered = events.slice();

            if (currentFilter === 'today') {
                filtered = filtered.filter(function(e) { return isToday(e.date); });
            } else if (currentFilter !== 'all') {
                filtered = filtered.filter(function(e) { return e.category === currentFilter; });
            }

            filtered.sort(function(a, b) {
                if (isToday(a.date) && !isToday(b.date)) return -1;
                if (!isToday(a.date) && isToday(b.date)) return 1;
                if (a.date !== b.date) return a.date.localeCompare(b.date);
                return a.time.localeCompare(b.time);
            });

            if (filtered.length === 0) {
                list.innerHTML = '<div class="empty"><div class="empty-icon">📭</div><p>Nenhum compromisso encontrado.</p><p>Adicione um novo acima!</p></div>';
                return;
            }

            var html = '';
            for (var i = 0; i < filtered.length; i++) {
                var ev = filtered[i];
                var todayClass = isToday(ev.date) ? 'today' : '';
                var pastClass = isPast(ev.date) && !isToday(ev.date) ? 'style="opacity: 0.5;"' : '';
                var icon = categoryIcons[ev.category] || '📅';
                var badgeClass = categoryColors[ev.category] || '';
                var badgeText = categoryNames[ev.category] || '';
                var todayBadge = isToday(ev.date) ? ' <strong style="color:#f0883e;">HOJE</strong>' : '';
                
                var medicationInfo = '';
                if (ev.category === 'medicamento' && ev.dosage) {
                    medicationInfo = '<div class="medication-reminder">💊 ' + ev.dosage + ' - ' + (ev.frequency || 'unica') + '</div>';
                }
                
                html += '<div class="event-item category-' + ev.category + ' ' + todayClass + '" ' + pastClass + '>';
                html += '<div class="event-icon">' + icon + '</div>';
                html += '<div class="event-info">';
                html += '<div class="event-title">' + ev.title + ' <span class="badge ' + badgeClass + '">' + badgeText + '</span>' + todayBadge + '</div>';
                html += '<div class="event-meta">' + formatDate(ev.date) + ' as ' + ev.time + '</div>';
                if (ev.description) {
                    html += '<div class="event-desc">' + ev.description + '</div>';
                }
                if (medicationInfo) {
                    html += medicationInfo;
                }
                html += '</div>';
                html += '<div class="event-actions">';
                html += '<button class="btn btn-danger btn-small" onclick="deleteEvent(\'' + ev.id + '\')">Excluir</button>';
                html += '</div>';
                html += '</div>';
            }
            list.innerHTML = html;
        }

        function updateStatusBar() {
            var now = new Date();
            var todayEvents = events.filter(function(e) { return isToday(e.date); });
            var hour = now.getHours();
            var min = String(now.getMinutes()).padStart(2, '0');
            var timeStr = String(hour).padStart(2, '0') + ':' + min;
            var dateStr = formatDate(getTodayStr());

            var status = dateStr + ' - ' + timeStr;
            if (todayEvents.length > 0) {
                status += ' - ' + todayEvents.length + ' compromisso(s) hoje';
            } else {
                status += ' - Dia livre!';
            }

            if (hour >= 1 && hour < 12) status += ' - Bom dia!';
            else if (hour >= 12 && hour < 18) status += ' - Boa tarde!';
            else status += ' - Boa noite!';

            document.getElementById('statusBar').textContent = status;
        }

        document.getElementById('eventForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            var newEvent = {
                id: Date.now().toString(),
                title: document.getElementById('title').value.trim(),
                category: document.getElementById('category').value,
                date: document.getElementById('date').value,
                time: document.getElementById('time').value,
                description: document.getElementById('description').value.trim()
            };
            
            // Adicionar campos de medicamento se for categoria medicamento
            if (newEvent.category === 'medicamento') {
                newEvent.dosage = document.getElementById('dosage').value.trim();
                newEvent.frequency = document.getElementById('frequency').value;
                newEvent.duration = document.getElementById('duration').value;
            }
            
            events.push(newEvent);
            localStorage.setItem('agendaAmiga_events', JSON.stringify(events));
            scheduleSaveToCloud();
            renderEvents();
            updateStatusBar();
            this.reset();
            document.getElementById('date').value = getTodayStr();
            document.getElementById('medicationFields').classList.remove('show');
            showBalloon('Compromisso salvo!', newEvent.title + ' em ' + formatDate(newEvent.date) + ' as ' + newEvent.time, false);
        });

        function deleteEvent(id) {
            if (confirm('Deseja realmente excluir este compromisso?')) {
                events = events.filter(function(e) { return e.id !== id; });
                localStorage.setItem('agendaAmiga_events', JSON.stringify(events));
                scheduleSaveToCloud();
                renderEvents();
                updateStatusBar();
            }
        }

        var filterBtns = document.querySelectorAll('.filter-btn');
        for (var i = 0; i < filterBtns.length; i++) {
            filterBtns[i].addEventListener('click', function() {
                for (var j = 0; j < filterBtns.length; j++) {
                    filterBtns[j].classList.remove('active');
                }
                this.classList.add('active');
                currentFilter = this.getAttribute('data-filter');
                renderEvents();
            });
        }

        function playAlertSound() {
            try {
                var ctx = new (window.AudioContext || window.webkitAudioContext)();
                var notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach(function(freq, i) {
                    var osc = ctx.createOscillator();
                    var gain = ctx.createGain();
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.type = 'sine';
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0, ctx.currentTime + i * 0.2);
                    gain.gain.linearRampToValueAtTime(0.3, ctx.currentTime + i * 0.2 + 0.05);
                    gain.gain.linearRampToValueAtTime(0, ctx.currentTime + i * 0.2 + 0.3);
                    osc.start(ctx.currentTime + i * 0.2);
                    osc.stop(ctx.currentTime + i * 0.2 + 0.3);
                });
            } catch (e) { console.log('Audio nao suportado'); }
        }

        function showBalloon(title, content, isMedication) {
            document.getElementById('alertTitle').textContent = title;
            document.getElementById('alertContent').textContent = content;
            var balloon = document.getElementById('alertBalloon');
            if (isMedication) {
                balloon.classList.add('medication');
            } else {
                balloon.classList.remove('medication');
            }
            balloon.classList.add('show');
            playAlertSound();
            setTimeout(function() { balloon.classList.remove('show'); }, 8000);
        }

        function closeAlert() {
            document.getElementById('alertBalloon').classList.remove('show');
        }

        function syncFromCloud() {
            loadFromCloud().then(function() {
                renderEvents();
                updateStatusBar();
            });
        }

        function forceSyncToCloud() {
            saveToCloud();
        }

        function checkDailyAlerts() {
            var now = new Date();
            var hour = now.getHours();
            var todayStr = getTodayStr();

            if (hour < 1) return;
            if (alertedToday[todayStr]) return;

            var todayEvents = events.filter(function(e) { return e.date === todayStr; });
            if (todayEvents.length === 0) return;

            var msg = 'Voce tem ' + todayEvents.length + ' compromisso(s) hoje!\n\n';
            for (var i = 0; i < todayEvents.length; i++) {
                var e = todayEvents[i];
                msg += e.time + ' - ' + e.title + '\n';
            }

            showBalloon('Lembrete do dia!', msg, false);
            alertedToday[todayStr] = true;
            localStorage.setItem('agendaAmiga_alerted', JSON.stringify(alertedToday));
        }

        // Sistema de alerta de medicamentos - verifica a cada minuto
        function checkMedicationAlerts() {
            var now = new Date();
            var currentTime = getCurrentTimeStr();
            var todayStr = getTodayStr();
            var alertKey = todayStr + '_' + currentTime;
            
            // Não alertar duas vezes no mesmo horário
            if (medicationAlerts[alertKey]) return;
            
            var medications = events.filter(function(e) {
                return e.category === 'medicamento' && e.time === currentTime;
            });
            
            if (medications.length === 0) return;
            
            var msg = 'Hora de tomar:\n\n';
            for (var i = 0; i < medications.length; i++) {
                var med = medications[i];
                msg += '💊 ' + med.title;
                if (med.dosage) msg += ' - ' + med.dosage;
                msg += '\n';
            }
            
            showBalloon('Hora do Medicamento!', msg, true);
            medicationAlerts[alertKey] = true;
            localStorage.setItem('agendaAmiga_medAlerts', JSON.stringify(medicationAlerts));
            
            // Limpar alertas antigos (manter só últimos 2 dias)
            var keys = Object.keys(medicationAlerts);
            if (keys.length > 200) {
                keys.sort();
                var toRemove = keys.slice(0, keys.length - 200);
                toRemove.forEach(function(k) { delete medicationAlerts[k]; });
                localStorage.setItem('agendaAmiga_medAlerts', JSON.stringify(medicationAlerts));
            }
        }

        function init() {
            document.getElementById('date').value = getTodayStr();
            document.getElementById('time').value = '09:00';
            
            loadFromCloud().then(function() {
                renderEvents();
                updateStatusBar();
                
                // Verificar alertas diários a cada 30 segundos
                setInterval(function() {
                    checkDailyAlerts();
                    updateStatusBar();
                }, 30000);
                
                // Verificar medicamentos a cada minuto
                setInterval(checkMedicationAlerts, 60000);
                
                // Verificar imediatamente ao carregar
                checkMedicationAlerts();
            });
        }

        init();
    </script>
</body>
</html>
